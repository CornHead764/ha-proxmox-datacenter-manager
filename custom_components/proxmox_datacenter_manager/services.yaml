migrate_vm:
  name: Migrate VM
  description: Migrate a virtual machine to a target host
  fields:
    vm_name:
      name: VM Name
      description: The name or VMID of the virtual machine to migrate
      required: true
      example: "my-vm"
      selector:
        text: {}
    target_host:
      name: Target Host
      description: "The target node to migrate the VM to. For same-cluster migrations, the VM lands on this exact node. For cross-cluster migrations, this is used to auto-detect the remote but PDM picks the actual node (limitation of PDM API - use a follow-up local migration to move to specific node)."
      required: true
      example: "pve-node2"
      selector:
        text: {}
    target_remote:
      name: Target Remote
      description: "The target remote/cluster. Leave empty to auto-detect from target_host. Cross-cluster limitation: PDM auto-selects which node in the target cluster receives the VM."
      required: false
      example: "datacenter2"
      selector:
        text: {}
    online:
      name: Online Migration
      description: Perform live migration (VM stays running)
      required: false
      default: true
      selector:
        boolean: {}
    with_local_disks:
      name: With Local Disks
      description: Include local disks in the migration (for local migrations only)
      required: false
      default: false
      selector:
        boolean: {}
    storage_map:
      name: Storage Mapping
      description: "Storage mapping for remote migrations. Format: {\"source-storage\": \"target-storage\"}"
      required: false
      example: '{"local-zfs": "local-lvm"}'
      selector:
        object: {}
    bridge_map:
      name: Bridge Mapping
      description: "Network bridge mapping for remote migrations. Format: {\"source-bridge\": \"target-bridge\"}"
      required: false
      example: '{"vmbr0": "vmbr0"}'
      selector:
        object: {}

start_vm:
  name: Start VM
  description: Start a virtual machine by name or VMID
  fields:
    vm_name:
      name: VM Name
      description: The name or VMID of the virtual machine to start
      required: true
      example: "my-vm"
      selector:
        text: {}

stop_vm:
  name: Stop VM
  description: Stop a virtual machine by name or VMID (force stop)
  fields:
    vm_name:
      name: VM Name
      description: The name or VMID of the virtual machine to stop
      required: true
      example: "my-vm"
      selector:
        text: {}

shutdown_vm:
  name: Shutdown VM
  description: Gracefully shutdown a virtual machine by name or VMID
  fields:
    vm_name:
      name: VM Name
      description: The name or VMID of the virtual machine to shutdown
      required: true
      example: "my-vm"
      selector:
        text: {}

reset_migration_state:
  name: Reset Migration State
  description: Reset the migration state sensor to idle

list_vms:
  name: List VMs
  description: List all VMs and containers discovered by PDM (useful for debugging)

debug_api:
  name: Debug API
  description: Inspect raw API responses from PDM (useful for troubleshooting connection issues)
