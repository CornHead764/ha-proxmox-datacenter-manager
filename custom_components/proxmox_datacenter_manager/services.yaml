migrate_vm:
  name: Migrate VM
  description: Migrate a virtual machine to a target host (works for both local and cross-cluster migrations)
  fields:
    vm_name:
      name: VM Name
      description: The name or VMID of the virtual machine to migrate
      required: true
      example: "my-vm"
      selector:
        text: {}
    target_host:
      name: Target Host
      description: The target node name to migrate the VM to
      required: true
      example: "pve-node2"
      selector:
        text: {}
    online:
      name: Online Migration
      description: Perform live migration (VM stays running)
      required: false
      default: true
      selector:
        boolean: {}
    with_local_disks:
      name: With Local Disks
      description: Include local disks in the migration (for local migrations only)
      required: false
      default: false
      selector:
        boolean: {}
    storage_map:
      name: Storage Mapping
      description: "Storage mapping for remote migrations. Format: {\"source-storage\": \"target-storage\"}"
      required: false
      example: '{"local-zfs": "local-lvm"}'
      selector:
        object: {}
    bridge_map:
      name: Bridge Mapping
      description: "Network bridge mapping for remote migrations. Format: {\"source-bridge\": \"target-bridge\"}"
      required: false
      example: '{"vmbr0": "vmbr0"}'
      selector:
        object: {}

start_vm:
  name: Start VM
  description: Start a virtual machine by name or VMID
  fields:
    vm_name:
      name: VM Name
      description: The name or VMID of the virtual machine to start
      required: true
      example: "my-vm"
      selector:
        text: {}

stop_vm:
  name: Stop VM
  description: Stop a virtual machine by name or VMID (force stop)
  fields:
    vm_name:
      name: VM Name
      description: The name or VMID of the virtual machine to stop
      required: true
      example: "my-vm"
      selector:
        text: {}

shutdown_vm:
  name: Shutdown VM
  description: Gracefully shutdown a virtual machine by name or VMID
  fields:
    vm_name:
      name: VM Name
      description: The name or VMID of the virtual machine to shutdown
      required: true
      example: "my-vm"
      selector:
        text: {}

shutdown_host_vms:
  name: Shutdown Host VMs
  description: Gracefully shutdown all running VMs on a specific host
  fields:
    host_name:
      name: Host Name
      description: The name of the Proxmox host/node whose VMs should be shutdown
      required: true
      example: "pve-node1"
      selector:
        text: {}
    remote_name:
      name: Remote Name
      description: The remote/cluster name (optional if host name is unique across remotes)
      required: false
      example: "my-cluster"
      selector:
        text: {}

shutdown_remote_vms:
  name: Shutdown Remote VMs
  description: Gracefully shutdown all running VMs on a specific remote/cluster
  fields:
    remote_name:
      name: Remote Name
      description: The remote/cluster name whose VMs should be shutdown
      required: true
      example: "my-cluster"
      selector:
        text: {}

shutdown_host:
  name: Shutdown Host
  description: Shutdown a Proxmox host/node
  fields:
    host_name:
      name: Host Name
      description: The name of the Proxmox host/node to shutdown
      required: true
      example: "pve-node1"
      selector:
        text: {}
    remote_name:
      name: Remote Name
      description: The remote/cluster name (optional if host name is unique across remotes)
      required: false
      example: "my-cluster"
      selector:
        text: {}

shutdown_all_hosts:
  name: Shutdown All Hosts
  description: Shutdown all hosts in a remote/cluster. Gracefully skips hosts that are already offline.
  fields:
    remote_name:
      name: Remote Name
      description: The remote/cluster name whose hosts should be shutdown
      required: true
      example: "my-cluster"
      selector:
        text: {}

reset_migration_state:
  name: Reset Migration State
  description: Reset the migration state sensor to idle

list_vms:
  name: List VMs
  description: List all VMs and containers discovered by PDM (useful for debugging)

debug_api:
  name: Debug API
  description: Inspect raw API responses from PDM (useful for troubleshooting connection issues)
